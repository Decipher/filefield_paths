filefield_paths.admin_settings:
  path: '/admin/config/media/file-system/filefield-paths'
  defaults:
    _form: '\Drupal\filefield_paths\Form\SettingsForm'
    _title: 'File (Field) Paths settings'
  requirements:
    _permission: 'administer site configuration'

filefield_paths.image_style_temporary:
  path: '/system/files/styles/{image_style}/temporary'
  defaults:
    _controller: '\Drupal\image\Controller\ImageStyleDownloadController::deliver'
    scheme: 'temporary'
    required_derivative_scheme: 'temporary'
  requirements:
    _access: 'TRUE'
    _ffp_temp_image_style: 'TRUE'
  options:
    no_cache: TRUE
